[project]
name = "jobradar"
version = "0.1.0"
description = "Daily job + funded-startup radar. Finds, ranks, drafts. Never applies, never sends."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "pypdf>=4",
    "anthropic>=0.40",
    "python-docx>=1.1",
    "feedparser>=6",
    "openpyxl>=3.1",
    "typer>=0.12",
]

[project.scripts]
jobradar = "jobradar.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobradar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
