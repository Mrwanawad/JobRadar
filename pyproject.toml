[project]
name = "jobradar"
version = "0.1.0"
description = "Agentic job-search platform: finds, ranks and drafts applications with a human approval gate."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6",
    "pypdf>=4",
    "python-docx>=1.1",
    "feedparser>=6",
    "openpyxl>=3.1",
    "typer>=0.12",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
# Platform mode: Temporal agent worker, LangGraph agents, Postgres, Elasticsearch, OTel.
# Lite mode (the CLI + SQLite) needs none of these.
platform = [
    "temporalio>=1.18",
    "langgraph>=1.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "elasticsearch>=9,<10",
    "protobuf>=6.31",
    "fastembed>=0.7",
    "opentelemetry-api>=1.38",
    "opentelemetry-sdk>=1.38",
    "opentelemetry-exporter-otlp-proto-grpc>=1.38",
    "opentelemetry-instrumentation-httpx>=0.59b0",
]

[project.scripts]
jobradar = "jobradar.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobradar"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["jobradar/v1"]  # protobuf codegen

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
