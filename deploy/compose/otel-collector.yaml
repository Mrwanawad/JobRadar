receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  batch: {}
  # Langfuse gets the agent worker's traces only: LangGraph nodes and LLM generations, with
  # their Temporal activity parents. Ingestion and gateway spans stay in Tempo.
  filter/agent_only:
    error_mode: ignore
    traces:
      span:
        - 'resource.attributes["service.name"] != "agent-worker"'

exporters:
  otlp/lgtm:
    endpoint: lgtm:4317
    tls: {insecure: true}
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}
    headers:
      Authorization: Basic ${env:LANGFUSE_AUTH}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/lgtm]
    traces/langfuse:
      receivers: [otlp]
      processors: [filter/agent_only, batch]
      exporters: [otlphttp/langfuse]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/lgtm]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/lgtm]
